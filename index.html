<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Psychology &amp; AI Quiz – 50 Questions (BSc S1)</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1d2433;--mu:#5b6478;--ac:#4f46e5;--ok:#15803d;--okb:#dcfce7;--no:#b91c1c;--nob:#fee2e2;--bd:#dfe3ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#10131c;--card:#1a1f2d;--tx:#e8ebf4;--mu:#9aa3b8;--ac:#8b85ff;--ok:#4ade80;--okb:#12301d;--no:#f87171;--nob:#3a1717;--bd:#2c3347}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px}h2{font-size:18px;margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
button,input,select{font:inherit;color:var(--tx)}
input,select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);margin:6px 0 12px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:12px 18px;cursor:pointer;width:100%;font-weight:600}
.btn.s{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-top:8px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.no{background:var(--nob);border-color:var(--no)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0 14px}.bar i{display:block;height:100%;background:var(--ac);width:0}
.tag{display:inline-block;font-size:12px;background:var(--bg);border:1px solid var(--bd);border-radius:20px;padding:2px 10px;color:var(--mu)}
#qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:10px;width:fit-content;margin:8px auto}
.row{display:flex;justify-content:space-between;gap:8px}.big{font-size:44px;font-weight:700;text-align:center;color:var(--ac)}
.hide{display:none}.rv{border-top:1px solid var(--bd);padding:10px 0;font-size:14px}
</style></head><body><main>
<div id="home">
 <div class="card"><h1>🧠 Psychology &amp; AI Quiz</h1><p class="mu">BSc S1 · 50 questions covering Modules I–III</p>
 <label class="mu">Your name / roll no.</label><input id="nm" placeholder="e.g. Anu – 23">
 <button class="btn" onclick="start()">Start quiz (50 questions)</button></div>
 <div class="card"><h2>📱 Scan to join</h2><div id="qr"></div>
 <p class="mu" style="text-align:center">Students scan this QR code with their phone camera.</p>
 <label class="mu">Page link (paste the shared link here if the QR shows a different address)</label><input id="lnk"><button class="btn s" onclick="qr()">Update QR</button></div>
</div>
<div id="qz" class="hide"><div class="card"><div class="row"><span class="tag" id="tg"></span><span class="mu" id="pg"></span></div>
 <div class="bar"><i id="pb"></i></div><h2 id="qq"></h2><div id="ops"></div><div id="fb" class="mu"></div>
 <button class="btn hide" id="nx" onclick="next()">Next →</button></div></div>
<div id="rs" class="hide"><div class="card"><h2 id="who"></h2><div class="big" id="sc"></div><p class="mu" id="msg" style="text-align:center"></p><div id="brk"></div>
 <button class="btn" onclick="start()">Try again</button><button class="btn s" onclick="home()">Home</button><button class="btn s" onclick="cp()">Copy my result</button></div>
 <div class="card"><h2>Review mistakes</h2><div id="rv"></div></div></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const M={1:"Module I: Intro to Psychology & Academic Foundations",2:"Module II: Research Tools for Psychology",3:"Module III: AI Integration in Psychology",4:"Experiential Learning Activities"};
// [module, question, correct, wrong, wrong, wrong]  (options are shuffled on screen)
const Q=[
[1,"Psychology is the scientific study of:","Behaviour and mental processes","Only abnormal behaviour","Only the brain","Only dreams and beliefs"],
[1,"The first psychology laboratory (Leipzig, 1879) was set up by:","Wilhelm Wundt","Sigmund Freud","B.F. Skinner","Carl Rogers"],
[1,"What makes psychology a science?","Empirical, testable evidence","Personal opinion","Tradition","Common sense"],
[1,"A testable prediction about variables is called a:","Hypothesis","Theory","Opinion","Sample"],
[1,"Which branch focuses on diagnosing and treating mental disorders?","Clinical psychology","Cognitive psychology","Social psychology","Experimental psychology"],
[1,"Applying psychology to selection, motivation and workplace behaviour is:","Industrial-Organizational psychology","Educational psychology","Health psychology","Abnormal psychology"],
[1,"Which method can establish cause and effect?","Experiment","Survey","Naturalistic observation","Case study"],
[1,"The variable manipulated by the researcher is the:","Independent variable","Dependent variable","Extraneous variable","Constant"],
[1,"The variable that is measured as the outcome is the:","Dependent variable","Independent variable","Control group","Hypothesis"],
[1,"A sample is:","A subset of the population studied","The entire population","The researcher’s prediction","A type of questionnaire"],
[1,"A correlation of −0.85 indicates:","A strong negative relationship","A weak positive relationship","No relationship","Proof of causation"],
[1,"Presenting another person’s work as your own is:","Plagiarism","Paraphrasing","Peer review","Citation"],
[1,"Which is a breach of academic integrity?","Fabricating data","Citing sources","Asking a teacher for clarification","Using a reference list"],
[1,"Paraphrasing someone’s idea without citing them is:","Still plagiarism","Acceptable","Original work","Fair use always"],
[1,"Information literacy means the ability to:","Find, evaluate and use information effectively","Memorise facts","Type quickly","Use social media"],
[1,"Which source is generally most reliable for research?","Peer-reviewed journal article","Anonymous blog","Social media post","Advertisement"],
[1,"Informed consent means participants:","Understand the study and agree voluntarily","Are paid","Stay anonymous only","Are told nothing"],
[2,"Google Scholar is mainly used to:","Search scholarly literature","Edit photos","Create surveys","Store passwords"],
[2,"Which Boolean operator narrows a search?","AND","OR","Both widen it","None"],
[2,"Putting a phrase in quotation marks searches for:","The exact phrase","Any word in it","Excluded words","Translations"],
[2,"Which is a psychology-specific database?","APA PsycInfo","Canva","Spotify","Photoshop"],
[2,"Zotero and Mendeley are:","Reference management tools","Statistics packages","Survey tools","Plagiarism detectors"],
[2,"A reference manager can:","Store citations and build a bibliography","Edit videos","Host websites","Grade exams"],
[2,"DOI stands for:","Digital Object Identifier","Data Online Index","Document Origin ID","Digital Open Interface"],
[2,"Google Forms is used to:","Create online questionnaires","Manage references","Run brain scans","Edit images"],
[2,"A good questionnaire item is:","Clear, single-focused and unbiased","Double-barreled","Leading","Vague"],
[2,"“Are you satisfied with teachers and facilities?” is an example of a:","Double-barreled question","Likert item","Open-ended item","Neutral item"],
[2,"Which Excel formula finds the mean of A1:A10?","=AVERAGE(A1:A10)","=SUM(A1:A10)","=COUNT(A1:A10)","=MAX(A1:A10)"],
[2,"In a spreadsheet, the intersection of a row and a column is a:","Cell","Sheet","Chart","Macro"],
[2,"Best chart to compare scores across categories:","Bar chart","Scatter plot","Word cloud","Flowchart"],
[2,"A scatter plot shows:","Relationship between two variables","Parts of a whole","Only categories","Text frequency"],
[2,"A pie chart is best for showing:","Proportions of a whole","Trends","Correlation","Distributions over time"],
[2,"APA in-text citation format is:","(Author, Year)","[1]","Footnote only","Author’s first name only"],
[2,"In APA, the reference list is arranged:","Alphabetically by first author’s surname","By year only","By length","Randomly"],
[3,"Artificial Intelligence refers to systems that:","Perform tasks normally needing human intelligence","Only move like robots","Only store data","Only play games"],
[3,"Machine learning means algorithms:","Learn patterns from data","Are manually coded for every case","Work without data","Replace electricity"],
[3,"A prompt is:","The instruction or input given to an AI","The AI’s answer","A database","A virus"],
[3,"A strong prompt usually includes:","Role, context, task and format","One vague word","No details","Only emojis"],
[3,"An AI ‘hallucination’ is when AI:","Gives confident but false information","Gets tired","Responds slowly","Encrypts data"],
[3,"AI-suggested references should be:","Verified to confirm they exist","Copied without checking","Always trusted","Ignored in APA"],
[3,"Algorithmic bias mainly arises from:","Biased or unrepresentative training data","Slow internet","Screen size","Battery"],
[3,"Which should NOT be pasted into a public AI tool?","Identifiable participant data","A general concept question","A public abstract","A topic idea"],
[3,"Honest use of AI in assignments requires you to:","Follow institutional policy and disclose use","Hide its use","Submit AI text as fully yours","Avoid reading outputs"],
[3,"AI tools can help in literature review by:","Summarising and suggesting search terms (with checking)","Replacing reading entirely","Guaranteeing accuracy","Writing true data"],
[3,"Using AI for brainstorming means you should:","Generate ideas, then critically refine them","Accept the first idea","Skip planning","Avoid sources"],
[3,"“Human-in-the-loop” means:","Humans review and decide on AI outputs","AI works with no oversight","Humans are replaced","AI is switched off"],
[3,"Which is an emerging AI use in mental health?","Chatbot-based support and screening","Replacing all clinicians","Diagnosing without data","Reading minds"],
[3,"AI in psychological assessment can help with:","Automated scoring and adaptive testing","Removing ethics approval","Making tests unreliable","Skipping validation"],
[3,"A key ethical limit of AI therapy chatbots is that they:","Cannot replace a licensed professional","Are always free","Never make errors","Understand every crisis"],
[3,"Confidentiality in AI use means:","Protecting private information from exposure","Sharing data freely","Posting results online","Ignoring consent"],
];
const $=id=>document.getElementById(id);let cur=[],i=0,sc=0,wrong=[],done=false;
const sh=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
function qr(){const t=$("lnk").value||location.href;$("qr").innerHTML="";try{new QRCode($("qr"),{text:t,width:180,height:180})}catch(e){$("qr").textContent="QR could not load"}}
$("lnk").value=location.href;qr();
function show(id){["home","qz","rs"].forEach(x=>$(x).classList.toggle("hide",x!=id));window.scrollTo(0,0)}
function home(){show("home")}
function start(){cur=Q.slice();i=0;sc=0;wrong=[];show("qz");render()}
function render(){const q=cur[i];done=false;$("tg").textContent="Module "+(q[0]==4?"Activities":["","I","II","III"][q[0]]);$("pg").textContent=(i+1)+" / "+cur.length;$("pb").style.width=(i/cur.length*100)+"%";$("qq").textContent=q[1];$("fb").textContent="";$("nx").classList.add("hide");
 $("ops").innerHTML="";sh(q.slice(2)).forEach(o=>{const b=document.createElement("button");b.className="opt";b.textContent=o;b.onclick=()=>pick(b,o);$("ops").appendChild(b)})}
function pick(b,o){if(done)return;done=true;const q=cur[i],ok=o===q[2];if(ok)sc++;else wrong.push(q);
 [...$("ops").children].forEach(x=>{if(x.textContent===q[2])x.classList.add("ok")});if(!ok)b.classList.add("no");
 $("fb").textContent=ok?"✅ Correct!":"❌ Correct answer: "+q[2];$("nx").textContent=i==cur.length-1?"See results":"Next →";$("nx").classList.remove("hide")}
function next(){if(++i>=cur.length)fin();else render()}
function fin(){show("rs");const p=Math.round(sc/cur.length*100);$("who").textContent=($("nm").value||"Your")+" result";$("sc").textContent=sc+" / "+cur.length+" ("+p+"%)";
 $("msg").textContent=p>=80?"Excellent work! 🌟":p>=50?"Good effort, review the mistakes below.":"Keep practising, you’ll improve!";
 const b={};cur.forEach(q=>b[q[0]]=(b[q[0]]||[0,0]),b[0]);cur.forEach(q=>b[q[0]][1]++);cur.forEach(q=>{if(!wrong.includes(q))b[q[0]][0]++});
 $("brk").innerHTML=Object.keys(b).map(k=>'<div class="rv row"><span>'+M[k]+'</span><b>'+b[k][0]+'/'+b[k][1]+'</b></div>').join("");
 $("rv").innerHTML=wrong.length?wrong.map(q=>'<div class="rv"><b>'+q[1]+'</b><br><span style="color:var(--ok)">✔ '+q[2]+'</span></div>').join(""):"<p class='mu'>No mistakes, perfect score! 🎉</p>"}
function cp(){const t=($("nm").value||"Student")+": "+$("sc").textContent+" – Psychology & AI Quiz";try{navigator.clipboard.writeText(t);alert("Copied! Paste it to your teacher.")}catch(e){prompt("Copy:",t)}}
</script></body></html>
